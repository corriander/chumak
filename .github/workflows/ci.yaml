name: 📦🚀 CI


on:
  push:
    branches:
      - '**'


permissions:
  contents: write
  pull-requests: write


# Serialise per-branch runs so a burst of merges can't pile up and exhaust the
# account's concurrent-job cap. On branches/PRs, cancel superseded runs for fast
# feedback; on main, queue instead of cancel so an in-flight PyPI publish is
# never killed mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


env:
  DEFAULT_PYTHON_VERSION: '3.13'


jobs:
  validation:
    name: 🧪 Validation
    # Skip on release-please's own release commit — it already ran pre-merge.
    # `startsWith`, not `contains`: the message includes the body, so a commit
    # that merely *mentions* the release prefix in prose would skip all checks.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(main)') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.ref == 'refs/heads/main' && fromJson('["3.13"]') || fromJson('["default"]') }}
        os: ${{ github.ref == 'refs/heads/main' && fromJson('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJson('["ubuntu-latest"]') }}

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: none
      pull-requests: none


    steps:
      - uses: actions/checkout@v7

      - uses: corriander/gha/uv/test@main
        env:
          UV_PYTHON: ${{ matrix.python-version == 'default' && env.DEFAULT_PYTHON_VERSION || matrix.python-version }}

  qa:
    name: 🛡️ QA
    # Formatting/lint/types are platform-independent, so this runs once rather
    # than across the validation matrix.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(main)') }}  # as validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: corriander/gha/uv/qa@v0.6.1
        env:
          UV_PYTHON: ${{ env.DEFAULT_PYTHON_VERSION }}

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [validation, qa]
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # for PyPI trusted publishing
    if: |  # always run on default branch as long as no failures, even if validation/qa are skipped
      always()
      && !contains(needs.*.result, 'failure')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.release_created

      - name: Build
        if: steps.release.outputs.release_created
        run: uv build

      - uses: svenstaro/upload-release-action@v2
        if: steps.release.outputs.release_created
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ steps.release.outputs.tag_name }}
          file_glob: true
          make_latest: false

      - name: Publish to PyPI
        if: steps.release.outputs.release_created
        run: uv publish --trusted-publishing always
