[project]
name = "chumak"
version = "0.5.0"
description = "Thin inference substrate: user-authored profiles, LangChain as a handler, optional provenance."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alex Corrie", email = "alex.j.corrie@gmail.com" },
]
dependencies = [
    "pydantic>=2.10",
    # 1.0 floor: the untyped handler path reads `AIMessage.text` as a property.
    # In langchain-core 0.3 `.text` is a *method*, so `payload=raw.text` would
    # silently be a bound method rather than the response text.
    "langchain>=1.0",
    "langchain-core>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.2.2"]
typesafe = ["typesafe-sdk>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff>=0.15.14",
    "ty>=0.0.21",
    "langchain-anthropic>=1.0",
    # The System One handler's unit suite stubs the SDK transport, so the SDK
    # itself must be importable in dev even though it is an optional extra.
    "typesafe-sdk>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumak"]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live inference backend (use --integration to enable)",
]
